        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.

        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Filer.Ui/js/filer-ui.js"></script>

         machinery (the hash token, the webassembly preload link, the importmap)
         only runs when this project publishes ITSELF — served from the api image
         (ADR-019), the placeholders would ship verbatim and the bootstrap would
         404. Fingerprinting is off (Filer.Web.csproj) so this file is identical
         in dev, tests and publish. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
