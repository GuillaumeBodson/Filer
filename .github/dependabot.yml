version: 2
updates:
  # NuGet versions are centralised in Directory.Packages.props; Dependabot edits it directly.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine patch/minor bumps to keep review light for a solo dev.
      minor-and-patch:
        update-types: [minor, patch]

  # Keep the Actions in ci.yml current and patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"

  # The production PostgreSQL image is pinned by digest (#272), so it can no
  # longer drift into a deploy by accident - but a pin alone trades silent
  # upgrades for silent staleness, which is worse on the container holding
  # personal documents. Dependabot turns each bump into a PR to review and
  # merge deliberately, with a backup taken first (deploy/README.md).
  #
  # Only /deploy is watched. The root docker-compose.yml is a development file
  # and deliberately keeps a floating tag: there, a new postgres:18 breaking
  # something should surface in a local run or CI, not on the server.
  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deploy)"
    ignore:
      # A major is not a mergeable PR. The data directory of one major cannot be
      # read by the next: PR #277 (17 -> 18) was verified to crash-loop the
      # container on the existing cluster, taking filer.api down with it through
      # `depends_on: service_healthy`. Landing it as a digest change would arm a
      # trap that fires on whatever unrelated release deploys next, since the
      # compose file now ships with every deploy (#276).
      #
      # A major upgrade is a planned operation with the data migrated by hand
      # first (runbook: deploy/README.md); the digest bump is then written in
      # that same PR. Patch and minor bumps - the reason this ecosystem is
      # watched at all - keep flowing.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
